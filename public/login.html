<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stride · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <!-- TOP RIGHT: STRIDE logo (OUTSIDE yellow box) -->
    <div class="top-right">
        <div class="logo">STRIDE</div>
        <div class="grow-tagline">grow every day.</div>
    </div>

    <!-- YELLOW BOX -->
    <div class="container">
        <div class="welcome-message">WELCOME BACK!</div>

        <div class="form-container">
            <form action="#" id="loginForm">
                <div class="form-group">
                    <label>EMAIL ID</label>
                    <input type="email" id="login-email" placeholder="your@email.com" required>
                </div>
                
                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn">login</button>
            </form>
            
            <div class="login-link">
                Don't have an account? <a href="signup.html">signup</a>
            </div>
        </div>
    </div>

    <!-- BOTTOM TAGLINE (OUTSIDE yellow box) -->
    <div class="bottom-tagline">
        <div class="tagline">TRACK·GROW·THRIVE</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
